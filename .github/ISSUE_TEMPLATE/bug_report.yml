name: Bug report
description: Something behaves incorrectly, including data masked that should not have been
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **masking bypass** — personal data reaching an appender in the clear — stop here and
        use private reporting instead: the
        [Security tab](https://github.com/Dancan254/log-guard/security/advisories) →
        **Report a vulnerability**. See
        [SECURITY.md](https://github.com/Dancan254/log-guard/blob/main/SECURITY.md).

        Never paste real personal data into an issue. Use synthetic values.

  - type: input
    id: version
    attributes:
      label: log-guard version
      placeholder: "0.1.1"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Logging backend
      options:
        - Logback
        - Log4j2
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Java and Spring Boot version
      placeholder: "Java 25 (Temurin), Spring Boot 4.1.1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The log line the appender actually received.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The annotated class or pattern, the log statement, and the configuration.
      render: java
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your log-guard configuration
      render: yaml
