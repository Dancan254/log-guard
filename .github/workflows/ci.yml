name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: ./mvnw --batch-mode test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build jars
        run: ./mvnw --batch-mode package -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: log-guard-jars
          path: '*/target/*.jar'

  clean-app:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install log-guard
        run: ./mvnw --batch-mode -DskipTests install
      # A Boot app whose only log-guard configuration is the dependency. If the starter ever stops
      # auto-configuring itself, this fails where no unit test would.
      - name: Consume the starter from a clean app
        run: ./smoke/verify.sh

  benchmarks:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Fewer forks and iterations than a local run: a shared runner cannot produce a publishable
      # number, and this job is not trying to. It is checking that nothing has changed shape.
      - name: Run the benchmarks
        run: >
          ./mvnw --batch-mode -Pbench -pl log-guard-benchmarks -am verify
          -DskipTests -Djmh.forks=1 -Djmh.warmupIterations=2 -Djmh.iterations=3
      - name: Check them against their ceilings
        run: ./log-guard-benchmarks/check-thresholds.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-report
          path: log-guard-benchmarks/target/benchmarks.txt
