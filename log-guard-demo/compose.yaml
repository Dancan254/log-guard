services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: logguard
      POSTGRES_USER: logguard
      POSTGRES_PASSWORD: logguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logguard -d logguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
